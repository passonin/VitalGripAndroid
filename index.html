<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="manifest" href="/manifest.webmanifest" />

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Vital Grip</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#070a0f;color:white;font-family:Arial,"Noto Sans JP",sans-serif}body{display:flex;justify-content:center;overflow:hidden}
.app{width:min(100vw,480px);height:100dvh;padding:14px;background:radial-gradient(circle at 50% 8%,#19232e,#080b10 45%,#05070a);display:flex;flex-direction:column;gap:10px}
.title{text-align:center;font-size:30px;font-weight:bold;letter-spacing:2px}
.glow{width:80%;height:4px;margin:0 auto 8px;background:#123040;opacity:.25;transition:.4s;}
.glow.powerOn{opacity:1;box-shadow:0 0 5px #28cfff,0 0 12px #28cfff,0 0 25px #28cfff,0 0 40px #28cfff;}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:7px}
.hold{position:relative;border:0;background:none}.hold:before{content:"";position:absolute;inset:10%;background:#343c49;clip-path:polygon(13% 20%,42% 7%,75% 14%,91% 42%,82% 78%,54% 94%,19% 82%,7% 51%);box-shadow:inset 0 -7px 12px #151a21,0 7px 12px #000;transition:.18s}.hold:after{content:"";position:absolute;width:24%;aspect-ratio:1;border-radius:50%;left:38%;top:38%;background:#06090d;border:3px solid #4b5563}
.hold.lit:before{background:var(--c);box-shadow:0 0 25px var(--c),inset 0 -7px 12px #551018,0 7px 12px #000}.hold.lit:after{border-color:#fff}
.status{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #303945;border-radius:12px;overflow:hidden;background:#0e131a}.cell{text-align:center;padding:8px 2px;border-right:1px solid #303945}.cell:last-child{border:0}.label{font-size:13px;color:#9ca5b1}.value{font-size:20px;font-weight:bold;color:#28aaff;margin-top:3px}
.hint{text-align:center;height:38px;font-size:28px;color:#8d98a6}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.ctrl{height:62px;border:0;border-radius:12px;color:#fff;font-size:29px;font-weight:bold;box-shadow:inset 0 1px 2px #fff5,0 7px 15px #0008}.power{background:linear-gradient(#e73542,#8e0f19)}.next{background:linear-gradient(#8648bd,#4a1975)}.color{background:linear-gradient(#1597c5,#075579)}.ok{background:linear-gradient(#28b84d,#087327);}
.titleRow{position:relative;height:62px;display:flex;justify-content:flex-end;align-items:center;}
.title{position:absolute;left:50%;transform:translateX(-50%);font-size:30px;font-weight:600;letter-spacing:8px;white-space:nowrap;pointer-events:none;}
.btBtn{width:66px;height:48px;border:0;border-radius:12px;background:linear-gradient(#2a8cff,#0c5fb8);display:flex;justify-content:center;align-items:center;cursor:pointer;box-shadow:inset 0 1px 2px #fff5,0 7px 15px #0008;transition:.2s;}
.btIcon{width:34px;height:34px;fill:none;stroke:white;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;}
.btBtn.connected{background:linear-gradient(#39ddff,#13a9d4);box-shadow:0 0 12px #28cfff,0 0 24px #28cfff,0 0 40px #28cfff,inset 0 1px 2px #fff8;}
</style></head><body><main class="app">
<div class="titleRow">
  <div style="width:62px;"></div>
  <div class="title">Vital Grip</div>
  <button id="btBtn" class="btBtn" title="Bluetooth接続">
    <svg viewBox="0 0 24 24" class="btIcon">
      <path d="M12 2v20l7-6-5-4 5-4-7-6zm2.5 4.5L17 8l-2.5 1.5V6.5zm0 8L17 16l-2.5 1.5v-3zM5 8l5 4-5 4M10 12L5 8m0 8 5-4"/>
    </svg>
  </button>
</div><div class="glow"></div><section class="grid" id="grid"></section>
<section class="status"><div class="cell"><div class="label">Mode</div><div class="value" id="mode">OFF</div></div><div class="cell"><div class="label">Select</div><div class="value" id="sel">0/12</div></div><div class="cell"><div class="label">Turn</div><div class="value" id="cnt">0/30</div></div></section>
<div class="hint" id="hint">電源を押して開始</div>
<nav class="controls"><button class="ctrl power" id="power">⏻</button><button class="ctrl next" id="next">▷</button><button class="ctrl color" id="color">△</button><button class="ctrl ok" id="ok">✓</button></nav>
</main>
<script>
let on=false,mode="off",one=0,left=0,right=6,play=0,count=0,pairs=[],pairNo=0,demoTimer=null,currentTask = [],makeNo=1,twoPlay=false,makePos=0,turn=0,sethold=null;
let taskSets = Array(12).fill(null).map(() => []);
let selectedTask = 0;
let playTask = [];
let playTurn = 0;
let selectSource = "";
let playReturnMode = "one";
let editTurn = 0;
let prevPlayHold = null;
let bleDevice=null;
let bleServer=null;
let bleService=null;
let bleCharacteristic=null;
let bleReceiveBuffer="";

//localStorage.removeItem("vitalTaskSets");

async function connectBLE(){try{
bleDevice=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:["0000dfb0-0000-1000-8000-00805f9b34fb"]});
bleServer=await bleDevice.gatt.connect();
bleService=await bleServer.getPrimaryService("0000dfb0-0000-1000-8000-00805f9b34fb");
bleCharacteristic=await bleService.getCharacteristic("0000dfb1-0000-1000-8000-00805f9b34fb");

await bleCharacteristic.startNotifications();bleCharacteristic.addEventListener("characteristicvaluechanged",e=>{const s=new TextDecoder().decode(e.target.value).trim();console.log("BLE RX:",s);if(s==="NEXT" && mode==="play"){nextTurn();}});
document.getElementById("btBtn").classList.add("connected");
hint.textContent="接続完了";
await sendLED("ALLOFF");
bleDevice.addEventListener("gattserverdisconnected",()=>{
document.getElementById("btBtn").classList.remove("connected");
bleCharacteristic=null;
bleService=null;
bleServer=null;
bleReceiveBuffer="";
hint.textContent="無線切断";
});

}catch(err){console.log(err);hint.textContent="接続失敗";}}
document.getElementById("btBtn").onclick = async ()=>{if(bleDevice && bleDevice.gatt && bleDevice.gatt.connected){await disconnectBLE();}else{await connectBLE();}};

function onBleReceive(e){let s=new TextDecoder().decode(e.target.value).trim();console.log("BLE RX:",s);if(s==="NEXT")nextTurn();}

async function nextTurn(){if(mode!=="play")return;playTurn++;if(playTurn>=playTask.length){h.forEach((_,i)=>paint(i,null));prevPlayHold=null;await sendLED("STOP");mode=playReturnMode;if(mode==="two")halves();else all(one);update();return;}h.forEach((_,i)=>paint(i,null));paint(playTask[playTurn-1],playColor(playTurn-1));paint(playTask[playTurn],playColor(playTurn));await sendLEDState();update();}
async function sendHold(no){if(!bleCharacteristic) return;await bleCharacteristic.writeValue(new TextEncoder().encode(String(no)));}
async function sendLED(cmd){try{if(!bleDevice) return;if(!bleDevice.gatt.connected) return;if(!bleCharacteristic) return;await bleCharacteristic.writeValue(new TextEncoder().encode(cmd + "\n"));}catch(err){console.log("BLE send error",err);}}
async function sendLEDState(){
  if(mode==="off" || !bleCharacteristic ||
     !bleDevice || !bleDevice.gatt.connected)return;

  // 12個のHoldを0～7の色番号にする
  const led = [];

  for(let i=0;i<12;i++){
    if(h[i].classList.contains("lit")){
      led[i] = getHoldColor(i) + 1;  // 1～7
    }else{
      led[i] = 0;                    // OFF
    }
  }

  // 12個 × 3bit = 36bit → 5byte
  const data = new Uint8Array(5);

  let bitPos = 0;

  for(let i=0;i<12;i++){
    const v = led[i] & 0x07;

    const bytePos = Math.floor(bitPos / 8);
    const shift = bitPos % 8;

    data[bytePos] |= v << shift;

    // 3bitが次のByteにまたがる場合
    if(shift > 5){
      data[bytePos + 1] |= v >> (8 - shift);
    }

    bitPos += 3;
  }

  try{
    await bleCharacteristic.writeValue(data);

    console.log(
      "BLE TX:",
      Array.from(data)
        .map(x=>x.toString(16).padStart(2,"0"))
        .join(" ")
    );

  }catch(e){
    console.log("LED STATE TX error:",e);
  }
}


function getHoldColor(i){
  const c=h[i].style.getPropertyValue("--c");

  for(let n=0;n<C.length;n++){
    if(C[n][1]===c)return n;
  }

  return 0;
}
async function disconnectBLE(){try{if(bleDevice && bleDevice.gatt.connected){bleDevice.gatt.disconnect();}document.getElementById("btBtn").classList.remove("connected");bleCharacteristic = null;bleService = null;bleServer = null;hint.textContent = "無線切断";}catch(err){console.log(err);}}

const glowBar = document.querySelector(".glow");
const C=[["赤","#ef2939"],["緑","#27c96f"],["青","#2f7df4"],["黄","#ffd43b"],["水","#21c8df"],["桃","#ff4f9a"],["白","#f4f7fb"]];
const g=document.getElementById("grid"),modeE=document.getElementById("mode"),selE=document.getElementById("sel"),cntE=document.getElementById("cnt"),hint=document.getElementById("hint");
for(let i=0;i<12;i++){let b=document.createElement("button");b.className="hold";b.dataset.i=i;g.appendChild(b)}
const h=[...document.querySelectorAll(".hold")];
const saved =localStorage.getItem("vitalTaskSets");if(saved){try{taskSets = JSON.parse(saved);}catch(e){console.error(e);}}

h.forEach(btn => {btn.onclick = () => {let idx = Number(btn.dataset.i);
if(mode==="make"){currentTask[editTurn] = idx;h.forEach((_,i)=>paint(i,null));paint(idx,5);update();return;}
if(mode==="play"){sendLED("TURNNEXT");return;}};});

function paint(i,c){if(c===null){h[i].classList.remove("lit");h[i].style.removeProperty("--c");}else{h[i].classList.add("lit");h[i].style.setProperty("--c",C[c][1]);}}
function all(c){for(let i=0;i<12;i++)paint(i,c);sendLEDState();}
function halves(){for(let i=0;i<12;i++)paint(i,(i%2===0)?left:right);sendLEDState();}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function resetPairs(){pairs=[];for(let a=0;a<7;a++)for(let b=a+1;b<7;b++)pairs.push([a,b]);shuffle(pairs);pairNo=0}
function randomDemo(){for(let i=0;i<12;i++){if(Math.random()<0.5){paint(i,null);}else{paint(i,Math.floor(Math.random()*7));}}sendLEDState();}
function playColor(turnNo){if(twoPlay){return turnNo % 2 === 0? left: right;}return one;}
function update(){modeE.textContent=mode==="one"?"1color":mode==="two"?"2color":mode==="demo" ? "Demo" :mode==="select" ? "Select" :mode==="make" ? "Set" :mode==="play"?"Play":"OFF";
if(mode==="play"){selE.textContent = `${play+1}/12`;}else if(mode==="make"){selE.textContent = `${makePos+1}/12`;}else{selE.textContent = "0/12";};
if(mode==="select"||mode==="make"){cntE.textContent=`${editTurn+1}/${currentTask.length}`;}else if(mode==="play"){cntE.textContent=`${playTurn+1}/${playTask.length}`;}else{cntE.textContent=`-`;}

if(!on)hint.textContent="電源を押して開始";
else if(mode==="one")hint.textContent=`1color：${C[one][0]}　△：色変更`;
else if(mode==="two")hint.textContent=`左：${C[left][0]} / 右：${C[right][0]} △：色変更`;
else if(mode==="demo")hint.textContent=`Demo　✅SetTask`;
else if(mode==="select"){let turnCount = "-";if(taskSets[selectedTask] &&taskSets[selectedTask].length > 0){turnCount =taskSets[selectedTask].length;}selE.textContent =`${selectedTask+1}/12`;cntE.textContent =turnCount;hint.textContent =`Task${selectedTask+1}　▷Task選択  ✅開始`;}
else if(mode==="play"){cntE.textContent=`${playTurn+1}/${playTask.length}`;const colorName = playColor(playTurn) !== undefined? C[playColor(playTurn)][0]: "";hint.textContent =`PLAY　${colorName}をタッチ`;}
else if(mode==="make")hint.textContent=`Task${selectedTask+1} ${editTurn+1}/${currentTask.length} Hold選択→▷次△前✅保存`;
else hint.textContent=`Task ${play+1}/12 ▷：次Task`}

document.getElementById("power").onclick=async()=>{on=!on;
if(on){glowBar.classList.add("powerOn");mode="one";one=0;left=0;right=6;all(0);}
else{
  glowBar.classList.remove("powerOn");
  clearInterval(demoTimer);
  demoTimer=null;

  h.forEach((_,i)=>paint(i,null));

  await sendLED("ALLOFF");

  mode="off";
}update();};

document.getElementById("next").onclick=()=>{
if(!on)return;
if(mode==="one"){mode="two";twoPlay=true;resetPairs();[left,right]=pairs.pop();pairNo++;halves();update();return}
if(mode==="two"){mode="demo";randomDemo();demoTimer=setInterval(()=>{if(mode==="demo"){randomDemo();}},1000);update();return}
if(mode==="demo"){clearInterval(demoTimer);demoTimer=null;mode="one";twoPlay=false;one=0;all(one);update();return}
if(mode==="select"){selectedTask=(selectedTask+1)%12;h.forEach((_,i)=>paint(i,null));paint(selectedTask,playColor(playTurn));sendLEDState();update();return;}
if(mode==="make"){if(currentTask[editTurn] === undefined){return;}editTurn++;if(editTurn >= currentTask.length){currentTask.push(undefined);}h.forEach((_,i)=>paint(i,null));if(currentTask[editTurn] !== undefined){paint(currentTask[editTurn],5);}sendLEDState();update();return;}
if(mode==="play"){return;}};

document.getElementById("color").onclick=()=>{if(!on)return;if(mode==="one"){one=(one+1)%7;all(one)}else if(mode==="two"){if(!pairs.length) resetPairs();[left,right] = pairs.pop();pairNo++;halves();};
if(mode==="make"){if(editTurn>0){editTurn--;h.forEach((_,i)=>paint(i,null));paint(currentTask[editTurn],5);sendLEDState();update();}return;}update()};
document.getElementById("ok").onclick=async()=>{if(!on)return;
if(mode==="one"){playReturnMode = "one";selectSource="play";mode="select";selectedTask=0;h.forEach((_,i)=>paint(i,null));paint(selectedTask,playColor(0));sendLEDState();update();return;}
if(mode==="two"){playReturnMode = "two";selectSource="play";mode="select";selectedTask=0;h.forEach((_,i)=>paint(i,null));paint(selectedTask,playColor(0));sendLEDState();update();return;}
if(mode==="demo"){clearInterval(demoTimer);demoTimer=null;selectSource="make";mode="select";selectedTask=0;;h.forEach((_,i)=>paint(i,null));paint(selectedTask,playColor(0));sendLEDState();update();return;}
if(mode==="select"){if(selectSource==="play"){playTask=taskSets[selectedTask].filter(v=>v!==undefined);if(!playTask.length){hint.textContent="データなし";return;}playTurn=0;prevPlayHold=null;mode="play";h.forEach((_,i)=>paint(i,null));paint(playTask[0],playColor(0));await sendLEDState();update();return;}
if(selectSource==="make"){mode="make";currentTask = taskSets[selectedTask]? [...taskSets[selectedTask]]: [];editTurn = 0;h.forEach((_,i)=>paint(i,null));if(currentTask[0]!==undefined){paint(currentTask[0],5);}sendLEDState();update();return;}}
if(mode==="make"){taskSets[selectedTask] = currentTask.filter(v => v !== undefined);localStorage.setItem("vitalTaskSets",JSON.stringify(taskSets));mode="demo";randomDemo();demoTimer=setInterval(()=>{if(mode==="demo"){randomDemo();}},1000);update();return;}
};

update();
</script></body></html>
